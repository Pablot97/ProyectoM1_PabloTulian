<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Paletas</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header>
        <h1>Generador de Paletas</h1>
        <p>Generá combinaciones de colores aleatorias.</p>
    </header>

    <main>

        <section>
            <h2>Configuración</h2>

            <label for="cantidad">Cantidad de colores:</label>
            <select id="cantidad">
                <option value="6">6 colores</option>
                <option value="8">8 colores</option>
                <option value="9">9 colores</option>
            </select>

            <label for="formato">Formato:</label>
            <select id="formato">
                <option value="hex">HEX</option>
                <option value="hsl">HSL</option>
            </select>

            <button id="generar">Generar paleta</button>
        </section>

        <section>
            <h2>Paleta generada</h2>

            <div id="paleta"></div>

            <p id="mensaje" role="status"></p>
        </section>

    </main>

    <footer>
        <p>Generador de Paletas - 2026 - Pablo Tulian</p>
    </footer>

    <script src="./js/script.js"></script>

</body>
</html>
